<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Selected works. View all 24 works on aslinurtuzer.co">
<style>@font-face{font-family:IS;src:url(data:font/woff2;base64,) format("woff2");font-weight:100 900}@font-face{font-family:GM;src:url(data:font/woff2;base64,) format("woff2");font-weight:100 900}
.rise{animation:rise 1.1s cubic-bezier(0.16,1,0.3,1) both;transform-box:fill-box}
@keyframes rise{from{transform:translateY(115%)}}
.appear{animation:appear .9s cubic-bezier(0.16,1,0.3,1) both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}
.spin{animation:spin 16s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 7s ease-in-out infinite}
@keyframes drift{50%{transform:translateY(-8px)}}
.pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{50%{opacity:.35}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(4px,-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1000" height="150" fill="#f4f5f7"/>

  <line x1="250.5" y1="0" x2="250.5" y2="150" stroke="rgba(14,14,14,0.12)"/><line x1="500.5" y1="0" x2="500.5" y2="150" stroke="rgba(14,14,14,0.12)"/><line x1="750.5" y1="0" x2="750.5" y2="150" stroke="rgba(14,14,14,0.12)"/>
