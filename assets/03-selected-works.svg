  <clipPath id="c4"><rect x="-20" y="58" width="1040" height="82"/></clipPath><g clip-path="url(#c4)"><g class="rise" style="animation-delay:0.1s"><text x="20" y="126" class="" text-anchor="start" style="font-family:IS,ISX,'Helvetica Neue',Arial,sans-serif;font-size:76px;font-weight:400;letter-spacing:-0.045em;fill:#0e0e0e;">SELECTED WORKS</text></g></g>
